apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: devops-demo-hpa
  namespace: demo

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-demo

  minReplicas: 2
  maxReplicas: 30

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 40

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30

    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
